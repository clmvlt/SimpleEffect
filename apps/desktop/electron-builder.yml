# Local and CI packaging (`pnpm package`). Installers are unsigned (see GUIDE-GIT.md).
appId: com.simpleeffect.app
productName: SimpleEffect
directories:
  output: release
  buildResources: build-resources
# Everything is bundled by electron-vite: the app ships no node_modules.
files:
  - out/**/*
  - package.json
npmRebuild: false
publish: null
# The workspace name "@se/desktop" would otherwise name the per-user install folder ("@sedesktop").
extraMetadata:
  name: simpleeffect

# se-core and the sidecars (ffmpeg, ffprobe, whisper.cpp in its `whisper/` subfolder and the
# ONNX Runtime library of face detection in `onnxruntime/`, from `pnpm fetch-binaries`) share
# `resources/bin/`, where se-core looks for them first (crates/se-media/src/tools.rs,
# crates/se-vision/src/runtime.rs). The filters leave out the fetch stamp (`.fetched.json`).
win:
  target: nsis
  extraResources:
    - from: ../../target/release/se-core.exe
      to: bin/se-core.exe
    - from: ../../resources/bin/win32-x64
      to: bin
      filter: [ffmpeg.exe, ffprobe.exe, whisper/**/*, onnxruntime/**/*]
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target: dmg
  identity: null
  extraResources:
    - from: ../../target/release/se-core
      to: bin/se-core
    - from: ../../resources/bin/darwin-${arch}
      to: bin
      filter: [ffmpeg, ffprobe, whisper/**/*, onnxruntime/**/*]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  maintainer: SimpleEffect <clmvlt@users.noreply.github.com>
  extraResources:
    - from: ../../target/release/se-core
      to: bin/se-core
    - from: ../../resources/bin/linux-x64
      to: bin
      filter: [ffmpeg, ffprobe, whisper/**/*, onnxruntime/**/*]
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
