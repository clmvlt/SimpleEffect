[package]
name = "se-domain"
description = "Pure document model of SimpleEffect: time, identifiers, items, operations and validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Deterministic ids (`from_test_index`) and an example project (`test_support`) for the tests of
# dependent crates. Never enabled in the shipped app.
test-support = []

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Integration tests (`tests/`) build the library without `cfg(test)`: enable its test helpers.
se-domain = { workspace = true, features = ["test-support"] }
insta = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
