[package]
name = "se-media"
description = "Media adapter: ffprobe/ffmpeg sidecar jobs and media analysis."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
se-app = { workspace = true }
se-domain = { workspace = true }
# DTOs this adapter writes or matches on (job kinds, thumbnail sheet metadata).
se-protocol = { workspace = true }
async-trait = { workspace = true }
process-wrap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
which = { workspace = true }
xxhash-rust = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
se-app = { workspace = true, features = ["test-support"] }
se-domain = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
