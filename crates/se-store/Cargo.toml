[package]
name = "se-store"
description = "Project persistence adapter: project folder, project.json and SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
se-app = { workspace = true }
se-domain = { workspace = true }
# DTOs stored as JSON (AI tasks and their events).
se-protocol = { workspace = true }
async-trait = { workspace = true }
dunce = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
trash = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
se-domain = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
