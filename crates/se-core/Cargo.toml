[package]
name = "se-core"
description = "SimpleEffect core process: composition root and local HTTP/WebSocket server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "se-core"
path = "src/main.rs"

[dependencies]
# Composition root: se-core may depend on every workspace crate (docs/architecture.md §3).
se-domain = { workspace = true }
se-protocol = { workspace = true }
se-app = { workspace = true }
se-store = { workspace = true }
se-media = { workspace = true }
se-transcribe = { workspace = true }
se-vision = { workspace = true }
se-agents = { workspace = true }
se-mcp = { workspace = true }
se-export = { workspace = true }
se-fonts = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
directories = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
# `ServiceExt::oneshot` to run tower-http's file service inside axum handlers.
tower = { version = "0.5.3", features = ["util"] }
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(windows)'.dependencies]
win32job = { workspace = true }

[dev-dependencies]
# In-memory ports for the router's unit tests.
se-app = { workspace = true, features = ["test-support"] }
se-domain = { workspace = true, features = ["test-support"] }
se-media = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
