[package]
name = "se-agents"
description = "AI CLI providers (Claude Code first) and their stream parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
se-app = { workspace = true }
se-domain = { workspace = true }
# DTOs this adapter produces (agent events, auth status, provider info).
se-protocol = { workspace = true }
async-trait = { workspace = true }
# Finds the user's home folder (well-known CLI install locations).
directories = { workspace = true }
# CLI processes in a job object (Windows) or process group (Unix): the whole tree dies on cancel,
# and no console window opens on Windows.
process-wrap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
which = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
se-app = { workspace = true, features = ["test-support"] }
se-domain = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
