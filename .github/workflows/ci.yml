# Runs everything `pnpm check` runs, on Linux and Windows, with the pinned sidecars (ffmpeg,
# ffprobe, whisper.cpp) and Playwright's Chromium (engine golden frames).
name: CI

on:
  push:
    branches: [dev, recette, main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: pnpm check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version of the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # ffmpeg/ffprobe and whisper.cpp pinned in scripts/binaries.manifest.json, cached until the
      # manifest changes.
      - uses: actions/cache@v6
        with:
          path: resources/bin
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/binaries.manifest.json') }}

      - run: pnpm fetch-binaries --yes

      # Chromium for the engine's golden-frame tests (Vitest browser mode, Playwright), cached
      # until the lockfile changes. `--with-deps` also installs its system libraries on Linux.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      # With the sidecars present, the ffmpeg integration tests run instead of being skipped.
      - run: pnpm check
