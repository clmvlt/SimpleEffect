# Builds the installers of every platform and, for version tags, publishes a GitHub release.
# Release commands for humans: GUIDE-GIT.md.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Tag v1.2.3-rc.1 → 1.2.3-rc.1; manual runs get a development version.
      - name: Set the app version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-dev.${RUN_NUMBER}"
          fi
          node scripts/set-version.mjs "$version"

      - run: cargo build --release -p se-core

      - name: Build the installer
        run: pnpm package
        env:
          # Installers are unsigned for now: never look for a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  publish:
    name: Publish the GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      # A tag with a "-" (v1.2.3-rc.1) is published as a pre-release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SimpleEffect $TAG" \
            --generate-notes \
            "${prerelease[@]}"
