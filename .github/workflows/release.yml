# Builds the installers of every platform and, for version tags, publishes a GitHub release.
# Release commands for humans: GUIDE-GIT.md. Installer names are stable
# (apps/desktop/electron-builder.yml): SimpleEffect-<version>-windows-x64-setup.exe,
# -macos-arm64.dmg, -macos-x64.dmg, -linux-x86_64.AppImage, -linux-amd64.deb.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest builds the Apple Silicon dmg, macos-15-intel the Intel one (without ONNX
        # Runtime: there is no official build for Intel Macs, ADR-0037).
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Tag v1.2.3-rc.1 → 1.2.3-rc.1; manual runs get a development version.
      - name: Set the app version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-dev.${RUN_NUMBER}"
          fi
          node scripts/set-version.mjs "$version"

      - run: cargo build --release -p se-core

      # ffmpeg/ffprobe and whisper.cpp pinned in scripts/binaries.manifest.json, cached until the
      # manifest changes.
      - uses: actions/cache@v6
        with:
          path: resources/bin
          key: sidecars-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/binaries.manifest.json') }}

      # whisper.cpp has no official macOS build: fetch-binaries compiles it from the pinned sources
      # with CMake (shipped by GitHub's macOS images; installed here if an image ever drops it).
      - name: Check CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v cmake >/dev/null; then
            brew install cmake
          fi
          cmake --version

      - run: pnpm fetch-binaries --yes

      # `pnpm package` = se-core, the bundles, the licence notices, then electron-builder. macOS
      # builds are ad-hoc signed (`identity: '-'`); no certificate is looked up.
      - name: Build the installer
        run: pnpm package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  publish:
    name: Publish the GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The notes list the commits since the previous tag: full history needed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      # A tag with a "-" (v1.2.3-rc.1) is published as a pre-release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SimpleEffect $TAG" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
