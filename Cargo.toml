[workspace]
resolver = "3"
members = [
  "crates/se-domain",
  "crates/se-protocol",
  "crates/se-app",
  "crates/se-store",
  "crates/se-media",
  "crates/se-transcribe",
  "crates/se-vision",
  "crates/se-fonts",
  "crates/se-agents",
  "crates/se-mcp",
  "crates/se-export",
  "crates/se-core",
  "crates/se-codegen",
  "crates/se-devtools",
]

# Shared package metadata. `scripts/set-version.mjs` rewrites `version` at release time.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/clmvlt/SimpleEffect"

# Every crate declares its dependencies with `{ workspace = true }` so versions live in one place.
[workspace.dependencies]
# Workspace crates (dependency rules: docs/architecture.md §3).
se-domain = { path = "crates/se-domain" }
se-protocol = { path = "crates/se-protocol" }
se-app = { path = "crates/se-app" }
se-store = { path = "crates/se-store" }
se-media = { path = "crates/se-media" }
se-transcribe = { path = "crates/se-transcribe" }
se-vision = { path = "crates/se-vision" }
se-fonts = { path = "crates/se-fonts" }
se-agents = { path = "crates/se-agents" }
se-mcp = { path = "crates/se-mcp" }
se-export = { path = "crates/se-export" }

# Third-party crates.
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
# Images returned by MCP tools travel as base64 (same major as rmcp's).
base64 = "0.23.1"
directories = "6.0.0"
dunce = "1.0.5"
# EBU R128 loudness (integrated, short-term, range, true peak) of analysed sound.
ebur128 = "0.1.11"
futures-util = "0.3.34"
# Lists the fonts installed on the system (se-fonts).
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "memmap"] }
hex = "0.4.3"
# Request parts handed to MCP tool handlers (the bearer token), as rmcp gives them.
http = "1.5.0"
# Sidecar processes in a job object (Windows) or process group (Unix): the whole tree dies on
# cancel, and no console window opens on Windows.
process-wrap = { version = "10.0.1", default-features = false, features = [
  "creation-flags",
  "job-object",
  "kill-on-drop",
  "process-group",
  "tokio1",
] }
# Snapshot tests (`json`: `assert_json_snapshot!` of serialized documents).
insta = { version = "1.49.0", features = ["json"] }
# Decodes the JPEG test picture of se-vision's real detection test (dev only).
jpeg-decoder = { version = "0.3.2", default-features = false }
# ONNX Runtime bindings (se-vision, ADR-0037): the library is loaded at runtime from
# `resources/bin/<platform>/onnxruntime/` (`pnpm fetch-binaries`, Microsoft's 1.31 builds), so
# nothing is downloaded or linked at build time; telemetry is disabled when it loads.
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "api-31",
  "load-dynamic",
  "std",
  "tracing",
] }
proptest = "1.12.0"
rand = "0.10.3"
# HTTPS downloads of transcription models and of the GPU pack, only after the user agreed
# (se-transcribe): rustls with the ring provider (built with the C compiler alone) and the
# system's certificate verifier.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# The MCP server of AI agents: streamable HTTP mounted at `/mcp` (se-mcp, ADR-0028).
rmcp = { version = "3.9.0", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# SQLite compiled in (`bundled` enables FTS5), so every platform gets the same engine.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# JSON Schemas of MCP tool inputs (the version rmcp uses).
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-256 of downloaded and imported transcription models.
sha2 = "0.11.1"
# Benchmarks of the core (`pnpm bench`, se-devtools, prompt 29).
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-tungstenite = "0.30.0"
trash = "5.3.0"
# Serves `/media` files with Range requests (206/416) and conditional headers; CORS for the
# renderer's frame uploads (`PUT /media/renders`).
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# `serde-json-impl`: `serde_json::Value` fields become the generated `JsonValue` type.
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = "1.29.0"
# Windows process creation flags (no console window for sidecars); same version as process-wrap.
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
# Windows: se-core puts itself in a kill-on-close job, so no sidecar outlives it (safe API).
win32job = "2.0.3"
# Finds ffmpeg/ffprobe on the PATH (PATHEXT aware on Windows).
which = "8.0.6"
# Content fingerprints of media files (xxh3 of their first and last MiB).
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
# `.setemplate` exchange files of the template library (se-store): plain deflate over zlib-rs
# (pure Rust), no encryption or exotic codecs.
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Errors are values: no implicit panics outside tests (tests are allowed via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
